# experiment configuration

# PRIMARY ARM: routing tasks. The model is told a parity RULE rather than the
# tool sequence, so it has to apply the rule to the value it is carrying, and a
# wrong value sends it down the wrong branch. Linear tasks turned out to be
# degenerate on real models -- both llama models scored p_t = g_t = 1.000 and
# hence L_t = 0, because the tool order is announced and the argument is a
# verbatim copy of the previous result, so there were no errors to propagate.
# Routing produced L_t = 0.500 on the same model at depth 4.
task_variant: routing

# CONTROL ARM: the linear suite is kept, at low n and a reduced depth grid, as a
# null control rather than dropped. Its expected result is L_t ~ 0, and reporting
# that in line is the point: it shows the propagation signal in the primary arm
# comes from the task structure and not from the harness or the scorer. A shorter
# grid because a null needs enough n to be a credible null, not enough to trace a
# curve through.
#
# Depth 8 is at token n (5). The control's job is to show L_t = 0 where
# propagation is POSSIBLE, and depth 4 already does that; depth 8 is retained only
# to confirm the null does not open up at the deepest bin. At the earlier n of 20
# it cost 20,621 tokens per task and the control arm was 17% of the whole bill,
# which is more than a null is worth when the binding model has 100,000 tokens a
# day.
control_arm:
  task_variant: linear
  depths: [1, 4, 8]
  per_depth: {1: 20, 4: 20, 8: 5}

# NESTED UNEQUAL-n BUDGETING.
#
# The daily token allowance (TPD) is the binding constraint on this tier, and it
# is NOT uniform: 100,000 for llama-3.3-70b against 500,000 for allam-2-7b. Sizing
# every model to the smallest allowance throws away most of the capacity of the
# others -- it cost 240 usable tasks against 817 for the same calendar time.
#
# So `per_depth` above is a REFERENCE allocation: the most any model will run.
# Each model runs a nested PREFIX of it, scaled to its own measured TPD over
# `budget_days`. Nesting is exact rather than conventional: the suite generators
# emit tasks depth by depth with k ascending and ids that do not depend on the
# count requested, so asking for fewer tasks at a depth returns precisely the
# first ones of the larger set. Consequences:
#
#   * cross-model contrasts stay exactly paired on the common prefix
#   * each model's own L_t/p_t/g_t use its full n, so richer models get tighter
#     intervals instead of being truncated to the poorest model's
#   * the binomial likelihood already takes per-model trial counts, so the
#     hierarchical fit needs no change
#   * pooled per-step counts for H4 draw their mass from the high-TPD models,
#     which is the only reason H4 remains testable at all here
#
# Set budget_days to null to run the reference allocation for every model.
budget_days: 8

depths: [1, 2, 4, 6, 8]

# REFERENCE per-depth task counts, NOT a uniform count and NOT what every model
# runs -- see the nested-unequal-n note above. A depth-8 task issues 8x the calls
# of a depth-1 task and costs ~37x the tokens, while the propagation signal lives
# at depth (L_1 is 0 by construction), so a uniform allocation spends most of a
# token-limited budget on the least informative bin. An int is still accepted here
# and applies to every depth.
#
# The SHAPE of this allocation was re-examined for H4 per-step power and kept. H4
# is a claim about how the error mix shifts along a chain, so it is resolved by
# step index, and a step index i is populated only by tasks of depth > i. Under an
# equal-n design an exhaustive search over 47,068 allocations at a fixed
# invocation ceiling found none with a better worst-case usable-step prefix than
# this shape, because per-step coverage and cost both scale with depth. What
# rescued H4 was not a better shape but nested unequal n, which roughly triples
# the pooled task count for the same calendar window.
#
# Depth 8 is trimmed from 70 to 47 (a third). It was 45% of the entire token
# bill at 70, being ~37x the cost of a depth-1 task rather than 8x: the routing
# schema grows with depth AND the whole prompt is re-sent at every step, so cost
# is roughly quadratic in depth. A wider depth-8 interval is the right price for
# keeping the bin, and the bin is never dropped -- it is where L_t is largest and
# where the depth trend is best resolved.
per_depth:
  1: 60
  2: 60
  4: 65
  6: 65
  8: 47

distractor_level: 1
seeds: 1                    # 1, not 2: the bootstrap resamples tasks anyway, so
                            # a second generator seed buys less than more tasks
feedback: structured        # structured | opaque
call_mode: uniform          # uniform | native
max_retries: 1

# Model IDs below were verified against each provider's LIVE model list and by
# a real completion call on 2026-08-09. Every ID in the previous version of this
# file was stale -- the entire Qwen2.5 / Llama-3.1-instruct generation has been
# retired from Groq's free tier -- so re-verify before any future run.
#
# `family` drives the hierarchical model's partial pooling; `scale` (billions of
# params) drives the pi-vs-scale figure. For MoE models `scale` is TOTAL params
# (the conventional headline figure) and `active_scale` records params active
# per token, which is what actually governs compute -- H2 can be read against
# either, and they disagree for gpt-oss.
#
# Design axes achievable on free tiers as of this date (see docs/RESULTS_real_run.md):
#   scale-within-family : llama {8, 70} and gpt-oss {20, 120} -- 2 points each,
#                         NOT the 3-4 the methodology asks for; no free host
#                         offers 3+ sizes of one family any more.
#   family-at-scale     : allam 7B vs llama 8B (~7-9B bin, 2 families only);
#                         gpt-oss 20B vs qwen 27B as a second mid-scale bin.
#   proprietary ref     : gemini-2.5-flash.
#   FC-tuned vs base    : NOT TESTABLE -- no xLAM/Hammer variant on any free host.
#
# `rpd` / `tpm` are the enforced rate limits, read from each provider's
# x-ratelimit-limit-* response headers on 2026-08-09 -- NOT from documentation,
# which quotes an org-wide 14,400 req/day for Groq when the enforced limit is
# per model and is 1,000/day for most of them. The runner paces against `tpm`
# and stops cleanly on `rpd`, and estimate_cost.py reads the same fields, so
# these are the single source of truth for both.
# `tpd` is the daily TOKEN allowance, measured 2026-08-10, and it is the binding
# constraint for this workload by a wide margin. It is read from the BODY of the
# 429 that enforces it, because it appears in NO response header -- every model
# returns "-" for x-ratelimit-limit-tokens-per-day. It is also non-uniform, so it
# cannot be inferred from one observation: llama-3.3-70b gets half what the
# mid-tier models get and a fifth of what the two high-RPD models get. Anyone
# replicating on this tier will hit these limits and find them documented
# nowhere; see docs/METHOD_NOTES_real_run.md.
models:
  # --- scale within family: Meta Llama (dense) ---
  - {name: "groq/llama-3.1-8b-instant",    family: "llama",   scale: 8,   provider: "groq", rpd: 14400, tpm: 6000, tpd: 500000}
  - {name: "groq/llama-3.3-70b-versatile", family: "llama",   scale: 70,  provider: "groq", rpd: 1000,  tpm: 12000, tpd: 100000}
  # --- scale within family: OpenAI gpt-oss (sparse MoE) ---
  - {name: "groq/openai/gpt-oss-20b",      family: "gpt-oss", scale: 20,  active_scale: 3.6, provider: "groq", rpd: 1000, tpm: 8000, tpd: 200000}
  - {name: "groq/openai/gpt-oss-120b",     family: "gpt-oss", scale: 120, active_scale: 5.1, provider: "groq", rpd: 1000, tpm: 8000, tpd: 200000}
  # --- family axis at matched scale ---
  - {name: "groq/qwen/qwen3.6-27b",        family: "qwen",    scale: 27,  provider: "groq", rpd: 1000,  tpm: 8000, tpd: 200000}
  - {name: "groq/allam-2-7b",              family: "allam",   scale: 7,   provider: "groq", rpd: 7000,  tpm: 6000, tpd: 500000}
  # --- proprietary reference: DISABLED, no working key ---
  # The Gemini key in .env returns 403 PERMISSION_DENIED ("Your project has
  # been denied access") on generateContent, confirmed against the raw REST
  # endpoint so it is not a LiteLLM routing issue. Listing models works, so the
  # key is valid but the project is blocked. Re-enable this single line once a
  # key from a fresh project is in .env; the response cache is per-model, so
  # adding it later costs nothing already spent on the six models above.
  # scale null = undisclosed parameter count, excluded from fig4 by design.
  # - {name: "gemini/gemini-2.5-flash",    family: "gemini",  scale: null, provider: "gemini"}

paths:
  results: data/results
  cache: data/cache
