# PHASE 4: controlled error injection.
#
# Run as:
#   py scripts/estimate_cost.py --config config/error_injection.yaml --days 3
#   py scripts/run_real_suite.py --config config/error_injection.yaml --tag inject
#
# WHAT THIS TESTS
#
# Every severity number in the paper so far is observational. In the free arm a
# corrupted context is something the model PRODUCED, so "accuracy is lower after a
# corrupted context" is confounded: whatever made the model err at step j-1 -- a hard
# branch, an unlucky value, a weak moment -- is still present at step j. Treatment is
# assigned by the model itself. That is the same identifiability problem the
# hierarchical fit hits from the other side, and it is why the fit's severity posterior
# is not credible on its own.
#
# Injection assigns treatment externally. Both members of a pair are built from a
# byte-identical gold prefix and differ in exactly one substituted number: the result
# reported for step j-1. The model did not choose to be corrupted. The difference in
# step-j accuracy between the two members is therefore a causal effect of context
# corruption, not an association with it, and it is the quantity pi is meant to be.
#
# Scoring is conditional-on-state. Under a corrupted ref the routing rule selects a
# different tool, so gold is no longer the right yardstick; both members are scored
# against what is correct GIVEN the value held. tests/test_error_injection.py pins this
# down by asserting a perfect conditional policy scores 1.000 on BOTH members -- without
# that, the arm would report a large effect against a perfect model and measure nothing
# but its own substitution.
#
# TWO CORRUPTION MODES, because they load different channels:
#
#   parity_flip        substituted value has OPPOSITE parity -> the correct TOOL changes.
#                      The selection channel. This is the mode that mimics a real
#                      propagated error in the routing task.
#   parity_preserving  substituted value has the SAME parity -> the correct tool is
#                      unchanged and only the argument differs. The argument channel.
#
# Running both separates "a corrupted context degrades rule application" from "a
# corrupted context degrades value transcription". parity_flip alone cannot: it moves
# tool and argument together. This decomposition maps directly onto the syntactic /
# semantic split the propagation model already assumes but has never measured directly.
#
# POSITIONS
#
# j in {1, 3, 5} on depth-6 tasks. Sweeping the position, rather than injecting at a
# fixed one, is what turns a single severity number into a profile: the step model
# assumes pi is constant along the chain, and if measured severity instead grows with j
# that assumption is wrong and the recurrence is misspecified in a way no aggregate fit
# would reveal. j=0 is impossible (no previous result to corrupt) and is rejected by the
# runner rather than clamped.
#
# SCOPE: ONE MODEL.
#
# allam-2-7b only. Both Llama models were retired from the Groq free tier on 2026-08-27
# (see docs/METHOD_NOTES_real_run.md), removing llama-3.1-8b-instant -- the other model
# carrying the main empirical claim -- from all further collection. This is a
# single-model causal check, not suite-wide validation, and must be reported that way.
# allam-2-7b is the more informative single subject: it has the larger conditional-
# severity estimate of the two main-claim models (+0.316 against llama-3.1-8b-instant's
# +0.149), so it is where the observational estimate has the most to be wrong about.
#
# COST
#
# Every task contributes 3 positions x 2 modes x 2 members = 12 calls, all of them
# prefix-heavy, so per-task cost is well above a routing task at the same depth. n is
# set accordingly: this arm buys precision on ONE number per cell rather than a depth
# profile, so it needs fewer tasks than the propagation sweep, not more.
task_variant: injection

depths: [6]
per_depth: {6: 60}

inject_at: [1, 3, 5]
injections: [parity_flip, parity_preserving]

# no nested control arm: the clean member of each pair IS the control, and it is a
# tighter one than a separate arm could be -- it shares the prefix byte for byte.
control_arm: null

budget_days: 3

distractor_level: 1
seeds: 1
feedback: structured
call_mode: uniform
max_retries: 1

models:
  - {name: "groq/allam-2-7b", family: "allam", scale: 7, provider: "groq", rpd: 7000, tpm: 6000, tpd: 500000}

paths:
  results: data/results
  cache: data/cache
